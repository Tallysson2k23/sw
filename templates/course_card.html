<article class="course-card"><a class="course-cover {% if course.photo_id %}has-photo{% endif %} cover-{{ (course.id - 1) % 3 }}" href="/cursos/{{ course.id }}" aria-label="Conhecer {{ course.title }}">{% if course.photo_id %}<img src="/foto/{{ course.photo_id }}" alt="{{ course.title }}" loading="lazy" width="600" height="400">{% endif %}<span>{{ course.category }}</span>{% if not course.photo_id %}<strong>{{ ['↗','✳','◈'][(course.id - 1) % 3] }}</strong>{% endif %}<small>SW / APRENDIZADO</small></a><div class="card-body">{% if course.demo %}<span class="badge">Demonstração</span>{% endif %}<h3><a href="/cursos/{{ course.id }}">{{ course.title }}</a></h3><p>{{ course.description[:150] }}</p><a class="text-link" href="/cursos/{{ course.id }}">Conhecer curso <span>↗</span></a></div></article>
